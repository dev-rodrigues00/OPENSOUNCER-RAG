name: CI / Enterprise Test & Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: enterprise_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Run Linter & Typecheck
        run: |
          npm run build

      - name: 🧪 Run Unit & Integration Tests with Coverage
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/enterprise_rag_test
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-dummy-test-key' }}
        run: npm test -- --coverage
